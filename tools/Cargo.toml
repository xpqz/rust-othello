[package]
name = "othello-tools"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
othello = { path = ".." }

# The same release profile as the engine's own manifest, so that benchmarks
# and matches measure the build that ships. See docs/PLAN.md, Build profile.
[profile.release]
lto = "fat"
codegen-units = 1
