[package]
name = "othello-tools"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
othello = { path = ".." }

# The same release profile as the engine's own manifest, so that benchmarks
# and matches measure the build that ships. See docs/PLAN.md, Build profile.
[profile.release]
lto = "fat"
codegen-units = 1

# The clock gate's analysis carries unit tests, so `cargo test` runs them.
[[example]]
name = "clock_time"
test = true

# The book diagnostic tracer carries unit tests as well.
[[example]]
name = "book_trace"
test = true

# The book diagnostic analysis carries unit tests as well.
[[example]]
name = "book_diag"
test = true
