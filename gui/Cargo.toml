[package]
name = "othello-gui"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Optional egui front end: play against the othello engine"

[dependencies]
othello = { path = ".." }
eframe = "0.37"

# Search is far too slow unoptimised; keep the engine fast even in dev builds.
[profile.dev.package.othello]
opt-level = 3
